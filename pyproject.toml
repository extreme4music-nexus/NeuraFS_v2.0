[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurafs"
version = "2.0.0"
description = "Virtual Neural Media File System Core Engine"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "fastapi",
    "uvicorn",
    "pydantic",
    "psutil",
    "winfspy; sys_platform == 'win32'",
]

[project.scripts]
neurafs = "neurafs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurafs*"]

[project.optional-dependencies]
dac = ["descript-audio-codec"]
encodec = ["encodec"]
codecs = ["descript-audio-codec", "encodec"]

[tool.setuptools.package-data]
neurafs = ["web/*.js", "web/public/*", "sdk/node/*.js", "package.json", "package-lock.json"]
