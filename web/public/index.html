<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraFS Storage Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        .context-menu {
            display: none; position: absolute; z-index: 1000; background: #ffffff;
            border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-radius: 0.5rem; min-width: 220px; padding: 0.25rem 0;
        }
        .context-menu button {
            width: 100%; text-align: left; padding: 0.5rem 1rem; font-size: 0.875rem;
            color: #334155; display: flex; align-items: center; gap: 0.75rem;
        }
        .context-menu button:hover { background-color: #f1f5f9; color: #0284c7; }
        .no-select { user-select: none; }
        .detached-panel {
            position: fixed !important; z-index: 9999 !important; resize: both !important;
            overflow: auto !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col no-select">

    <div id="appDashboard" class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm relative z-40">
            <div class="flex items-center gap-3">
                <div class="bg-sky-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg leading-none">NeuraFS Storage Explorer</h1>
                    <span class="text-xs text-slate-400">Implicit Signal Representation & VFS Engine v2.0</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md mx-6">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search files, media..." 
                           class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
            </div>

            <!-- Action Toolbar & Selectors -->
            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-lg p-1">
                    <i class="fa-solid fa-microchip text-indigo-600 text-xs ml-1.5"></i>
                    <select id="computeDeviceSelect" class="bg-transparent text-slate-700 text-xs font-bold py-1 px-1 focus:outline-none cursor-pointer">
                        <option value="cpu" selected>CPU Multi-Core</option>
                        <option value="cuda">GPU (CUDA)</option>
                    </select>
                </div>

                <div class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-lg p-1">
                    <i class="fa-solid fa-sliders text-sky-600 text-xs ml-1.5"></i>
                    <select id="precisionModeSelect" class="bg-transparent text-slate-700 text-xs font-bold py-1 px-1 focus:outline-none cursor-pointer">
                        <option value="fp16" selected>FP16 (Standard Compact)</option>
                        <option value="fp32">FP32 (High-Precision Archive)</option>
                    </select>
                </div>

                <label class="px-3 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-medium rounded-lg transition cursor-pointer flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Files
                    <input type="file" id="fileInput" class="hidden" multiple onchange="handleFileUpload(event)">
                </label>
            </div>
        </header>

        <!-- Main Explorer Content Area -->
        <div class="flex-1 flex overflow-hidden">
            <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden p-6">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase">
                            <th class="pb-3 pl-2">Name</th>
                            <th class="pb-3">Type</th>
                            <th class="pb-3">Precision</th>
                            <th class="pb-3 text-right">Original Size</th>
                            <th class="pb-3 text-right">Container Size (.hcs)</th>
                            <th class="pb-3 text-center">Fidelity (SI-SDR)</th>
                        </tr>
                    </thead>
                    <tbody id="fileExplorerBody" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="mediaModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative">
            <button onclick="closeModal('mediaModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="mediaTitle" class="font-bold text-lg text-slate-800 mb-4">Media Resynthesis Player</h3>
            <div id="mediaPlayerContainer" class="w-full flex justify-center bg-black rounded-xl overflow-hidden min-h-[200px]"></div>
        </div>
    </div>

    <script>
        let fileTreeData = [];
        let searchQuery = '';

        document.addEventListener('DOMContentLoaded', () => { fetchFileTree(); });

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024; const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchFileTree() {
            try {
                const response = await fetch('/api/fs/tree');
                const data = await response.json();
                fileTreeData = data.root || [];
                renderExplorer();
            } catch (error) { console.error('Failed to fetch file tree:', error); }
        }

        function renderExplorer() {
            const tbody = document.getElementById('fileExplorerBody');
            tbody.innerHTML = '';

            fileTreeData.forEach(item => {
                if (item.type === 'folder') return;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-sky-50/50 cursor-pointer transition';

                const metrics = item.metrics || {};
                const sisdr = metrics.si_sdr_db ? `${metrics.si_sdr_db} dB` : 'N/A';

                tr.innerHTML = `
                    <td class="py-3 pl-2 font-medium text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-file-audio text-purple-500"></i>
                        <span>${item.name}</span>
                    </td>
                    <td class="py-3 text-slate-400 text-xs uppercase">${item.file_category}</td>
                    <td class="py-3 text-slate-600 font-mono text-xs">${item.precision.toUpperCase()}</td>
                    <td class="py-3 text-right text-slate-600 font-mono text-xs">${formatBytes(item.original_size)}</td>
                    <td class="py-3 text-right text-emerald-600 font-mono text-xs font-semibold">${formatBytes(item.compressed_size)}</td>
                    <td class="py-3 text-center"><span class="px-2 py-0.5 text-[10px] font-bold bg-sky-100 text-sky-700 rounded-full">${sisdr}</span></td>
                `;

                tr.onclick = () => openMediaPreview(item);
                tbody.appendChild(tr);
            });
        }

        async function openMediaPreview(item) {
            const streamUrl = `/api/fs/stream?path=${encodeURIComponent(item.path)}`;
            document.getElementById('mediaTitle').innerText = item.name;
            const container = document.getElementById('mediaPlayerContainer');
            container.innerHTML = `<audio controls autoplay class="w-full my-8 px-4"><source src="${streamUrl}" type="audio/wav"></audio>`;
            document.getElementById('mediaModal').classList.remove('hidden');
        }

        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            const precisionMode = document.getElementById('precisionModeSelect').value;
            const computeDevice = document.getElementById('computeDeviceSelect').value;

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('taskId', 'task_' + Date.now());
                formData.append('precisionMode', precisionMode);
                formData.append('computeDevice', computeDevice);

                await fetch('/api/fs/upload-async', { method: 'POST', body: formData });
            }
            setTimeout(fetchFileTree, 2000);
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
